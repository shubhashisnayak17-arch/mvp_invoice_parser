<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deterministic Document Parser & Celigo Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Document Parser & Celigo Portal</h1>
        <p class="text-gray-600 mb-6">Upload PDFs or a ZIP folder, preview structured JSON, then send to Celigo.</p>
        
        <form id="uploadForm" class="space-y-4">
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition">
                <input type="file" id="fileInput" name="files" multiple accept=".pdf,.zip" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
            </div>
            
            <div class="flex gap-4">
                <button type="button" id="parseBtn" class="w-1/2 bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg hover:bg-gray-900 transition">1. Parse & Preview Data</button>
                <button type="button" id="sendBtn" class="w-1/2 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition opacity-50 cursor-not-allowed" disabled>2. Send to Celigo</button>
            </div>
        </form>

        <div id="loading" class="hidden mt-6 text-center text-blue-600 font-medium">Extracting ZIP and parsing documents (this may take a moment)... Please wait.</div>
        
        <div id="resultContainer" class="hidden mt-8 border-t pt-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">Structured JSON Response & Status:</h2>
            <pre id="outputJson" class="bg-gray-900 text-green-400 p-4 rounded-lg text-sm overflow-x-auto max-h-96"></pre>
        </div>
    </div>

    <script>
        let latestPayload = null;

        document.getElementById('parseBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) { alert('Please select at least one file or ZIP folder.'); return; }

            const formData = new FormData();
            for (let i = 0; i < fileInput.files.length; i++) { formData.append('files', fileInput.files[i]); }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000);

            try {
                const response = await fetch('/api/parse-documents', { 
                    method: 'POST', 
                    body: formData,
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Server error during parsing');

                latestPayload = result.data;
                document.getElementById('outputJson').textContent = JSON.stringify(result, null, 2);
                document.getElementById('resultContainer').classList.remove('hidden');

                const sendBtn = document.getElementById('sendBtn');
                sendBtn.disabled = false;
                sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } catch (err) {
                if (err.name === 'AbortError') {
                    alert('Error: The ZIP processing took too long and timed out.');
                } else {
                    alert('Error: ' + err.message);
                }
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });

        document.getElementById('sendBtn').addEventListener('click', async () => {
            if (!latestPayload) { alert('Please parse documents first.'); return; }

            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch('/api/send-to-celigo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(latestPayload)
                });
                const result = await response.json();
                
                document.getElementById('outputJson').textContent = JSON.stringify(result, null, 2);
            } catch (err) { alert('Error: ' + err.message); }
            finally { document.getElementById('loading').classList.add('hidden'); }
        });
    </script>
</body>
</html>
